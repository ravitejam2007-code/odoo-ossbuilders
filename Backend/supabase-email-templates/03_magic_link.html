<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Your One-Time Login Code</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f1f4f7; margin: 0; padding: 20px; }
    .container { max-width: 580px; margin: 0 auto; background: #ffffff; border-radius: 16px; border: 1px solid #ced0d4; overflow: hidden; }
    .header { background: #0064e0; padding: 32px 24px; text-align: center; color: #ffffff; }
    .header h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .content { padding: 32px 28px; color: #1c1e21; }
    .greeting { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
    .text { font-size: 15px; line-height: 1.6; color: #444950; margin-bottom: 24px; }
    .otp-box { background: #f1f4f7; border-radius: 12px; padding: 20px; text-align: center; margin: 24px 0; border: 1px dashed #ced0d4; }
    .otp-code { font-size: 32px; font-weight: 700; letter-spacing: 6px; color: #0064e0; font-family: monospace; }
    .footer { background: #f1f4f7; padding: 20px 28px; font-size: 12px; color: #8595a4; text-align: center; border-top: 1px solid #dee3e9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Dayflow HRMS</h1>
      <p style="margin: 6px 0 0 0; font-size: 14px; opacity: 0.9;">Secure Login Code</p>
    </div>
    <div class="content">
      <div class="greeting">Hello,</div>
      <p class="text">
        Use the one-time verification code below to complete your login to the Dayflow portal:
      </p>

      <div class="otp-box">
        <div class="otp-code">{{ .Token }}</div>
      </div>

      <p class="text" style="font-size: 13px; color: #5d6c7b;">
        This code is valid for 10 minutes. Do not share this code with anyone.
      </p>
    </div>
    <div class="footer">
      &copy; 2026 Dayflow HRMS. All rights reserved.<br>
      Delivered via Brevo SMTP.
    </div>
  </div>
</body>
</html>
